# ==========================================
# nginx-trainer-pro.conf
# Blocos a ADICIONAR no nginx.conf do servidor Lightsail
# (dentro do bloco http { ... } existente)
#
# Após adicionar, execute no servidor:
#   sudo nginx -t && sudo systemctl reload nginx
# ==========================================

    # ----------------------------------------
    # Trainer Pro — trainer.seudominio.com.br
    # Redireciona HTTP → HTTPS
    # ----------------------------------------
    server {
        listen 80;
        server_name trainer.seudominio.com.br;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name trainer.seudominio.com.br;

        # Certificados SSL (gerados pelo Certbot — veja ssl-setup.sh)
        ssl_certificate     /etc/letsencrypt/live/trainer.seudominio.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trainer.seudominio.com.br/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Limite de upload para fotos de avaliação (10MB)
        client_max_body_size 10M;

        # Proxy para o container Trainer Pro (porta 3335)
        location / {
            proxy_pass         http://localhost:3335;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
